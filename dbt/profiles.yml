world_cup_intelligence:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'worldcup') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'worldcup') }}"
      port: 5432
      dbname: worldcup
      schema: analytics
      threads: 4
