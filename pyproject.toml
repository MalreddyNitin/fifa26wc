[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-intelligence"
version = "0.1.0"
description = "Leakage-safe World Cup 2026 football data and modeling platform"
requires-python = ">=3.11"
dependencies = [
  "curl-cffi==0.15.0",
  "joblib==1.5.2",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "pyarrow==25.0.0",
  "PyYAML==6.0.1",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "SQLAlchemy==2.0.30",
]

[project.optional-dependencies]
api = [
  "fastapi==0.116.1",
  "grpcio==1.75.1",
  "grpcio-tools==1.75.1",
  "uvicorn==0.35.0",
]
dashboard = [
  "streamlit==1.50.0",
  "plotly==6.3.1",
  "requests>=2.32,<3",
]
dev = [
  "coverage==7.10.7",
  "mypy==1.18.2",
  "pre-commit==4.3.0",
  "pytest==8.4.2",
  "ruff==0.13.2",
]
models = [
  "mlflow==3.4.0",
  "shap==0.49.1",
  "statsmodels==0.14.5",
  "xgboost==3.0.5",
]
streaming = ["confluent-kafka==2.11.1", "redis==6.4.0"]
warehouse = ["dbt-core==1.10.13", "dbt-postgres==1.9.0", "psycopg==3.2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["world_cup_intelligence"]
